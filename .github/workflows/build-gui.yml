name: build-gui

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 安卓端/文档改动不重启桌面打包：两个产物互不依赖，
    # 同时排队只会互相抢 runner，也让"哪个先好"看不清楚。
    paths-ignore:
      - "tianwang_android/**"
      - "android_bridge/**"
      - "docs/**"
      - "scripts/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 全量门禁单独一个 job，与打包**并行**，互不阻塞。
  #
  # 为什么必须拆：原先这两步串在同一个 job 里，门禁红一项（2026-10-31 实测
  # 108/117，红 8 项）打包就不执行 —— 结果是"从来没有产出过 exe"，
  # 而 CI 只显示"红了"，看不出到底包能不能打出来。
  # 门禁红 ≠ 包打不出来，这是两件事，不该串成一条命。
  # 拆开后：门禁红照实报红（不 continue-on-error，不掩盖），产物照样出。
  selftests:
    runs-on: windows-latest
    # 全量门禁按位置切 4 片，4 个 runner 并行跑：
    # 串行一次要 5~6 分钟，切成 4 片后墙钟时间约等于最慢的一片。
    # 分片是「同样的用例、同样的断言」，只是分摊到不同机器，不是少跑。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt

      # ffmpeg/ffprobe 是媒体门禁的硬依赖（mediaops / audioops / videogen 都要
      # 在 PATH 里真找到两个可执行程序）。runner 没预装，缺了就是三项红。
      # imageio-ffmpeg 只有 ffmpeg、没有 ffprobe，顶不上，这里装完整的一套。
      - name: 装 ffmpeg/ffprobe
        shell: bash
        run: |
          choco install ffmpeg -y --no-progress --limit-output
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"

      # 两条活线门禁（eval_t31 对比度 / eval_t32 死链）要有真浏览器才跑得起来。
      # 不装的话它们会 skip —— skip 不算通过，等于这两条在 CI 上是空的。
      # Windows runner 不支持 --with-deps（那是 Linux 装系统库用的），直接装 chromium。
      - name: 装 UI 审计依赖（playwright + chromium）
        run: |
          npm ci
          npx playwright install chromium
        working-directory: tools/uicheck

      - name: 慢门禁开关
        # 本地已经不跑长门禁了（2026-11-06 定），那 t32 就只能在这里跑。
        # 但它一条约 15 分钟（Playwright 逐个点界面），不能每次 push 都陪跑：
        # 打 tag 或手动触发时才带上，日常 push 只跑快档。
        id: slow
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" \
             || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "flag=--slow" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: 自测（全量门禁，数字见 docs/_stats.json）
        # 不写具体条数：手填必然过期（历史上出现过 52/58/67/74 四个版本并存）。
        # 失败项连同输出尾巴会写进 Job Summary（见 run_selftests._write_ci_summary），
        # 所以「红在哪」不用翻日志。
        timeout-minutes: 60
        env:
          FLEET_PY: python
        run: python run_selftests.py --shard ${{ matrix.shard }}/${{ strategy.job-total }} ${{ steps.slow.outputs.flag }}

  build-windows:
    runs-on: windows-latest
    env:
      # Windows runner 控制台默认 charmap，中文打印会 UnicodeEncodeError——全局锁 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: 冒烟（先证明后端自己能起，再谈打包）
        # 控制台的 cp1252 中文打印会 UnicodeEncodeError，必须挡构建；
        # --smoke 只起服务探 /api/health，不开窗、不依赖 webview，无显示器也能跑。
        run: python fleet_gui.py --smoke

      - name: 打包 fleet-gui.exe
        run: python tools/build_gui.py

      - name: 冒烟打包产物
        # 真挡，不再 continue-on-error。
        # 原来写"只报不挡"的理由是「onefile 冷启动要先解压，等不够会误判」——
        # 2026-10-29 实测：`--smoke` **不建窗口、不 import webview**，直接起服务探
        # /api/health，退出码稳定为 0（本机冻扁包实测）。既然等得够，就不该留
        # 「产物坏了也不红」这个口子——那和注释骗人是同一类问题。
        run: dist\fleet-gui.exe --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-gui-windows
          path: dist/fleet-gui.exe
          if-no-files-found: error

      - name: 打成 tag 就挂到 release 上
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fleet-gui.exe
