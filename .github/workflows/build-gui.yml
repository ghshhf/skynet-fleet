name: build-gui

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: 冒烟（先证明后端自己能起，再谈打包）
        # 控制台的 cp1252 中文打印会 UnicodeEncodeError，必须挡构建；
        # --smoke 只起服务探 /api/health，不开窗、不依赖 webview，无显示器也能跑。
        run: python fleet_gui.py --smoke

      - name: 打包 fleet-gui.exe
        run: python tools/build_gui.py

      - name: 冒烟打包产物
        # onefile 冷启动要先解压，等不够会误判成坏了，所以只报不挡
        continue-on-error: true
        run: dist\fleet-gui.exe --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-gui-windows
          path: dist/fleet-gui.exe
          if-no-files-found: error

      - name: 打成 tag 就挂到 release 上
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fleet-gui.exe
