name: build-tui

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller textual rich prompt_toolkit

      - name: 冒烟（先证明界面自己能起来，再谈打包）
        # CI 的控制台是 cp1252，中文 print 会当场 UnicodeEncodeError：
        # 这是推上来才暴露的坑，本地 UTF-8 永远绿，所以它必须挡构建
        run: python -m fleet.tui --smoke

      - name: 打包 fleet-tui.exe
        run: >
          pyinstaller --onefile --clean --name fleet-tui
          --collect-all textual --collect-submodules fleet
          fleet_tui.py

      - name: 冒烟打包产物
        # onefile 冷启动要先解压，等不够会误判成坏了，所以只报不挡
        continue-on-error: true
        run: dist\fleet-tui.exe --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-tui-windows
          path: dist/fleet-tui.exe
          if-no-files-found: error

      - name: 打成 tag 就挂到 release 上
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fleet-tui.exe
