name: build-app

# 新一代手机端（tianwang_app）独立一条流水线。
# 老的 tianwang_android 走 build-android.yml，两份互不影响；
# 这里只认 tianwang_app/**，改老工程不会连带重启这条。
#
# 为什么放 CI：本机可以没有 Android SDK / NDK，但 GitHub 的 ubuntu 镜像自带 SDK，
# 整包编译在这里跑，比“等一台真机插上 USB”可靠。
#
# 2026-11-13 修订：
#   · 改用项目自带的 Gradle wrapper（9.2.1，与本地 ./gradlew 完全一致），
#     不再把 Gradle 钉死成 8.14——那套版本与本地不一致，CI 必崩。
#   · 去掉 JVM 单测步骤（主人定：本地开发不跑测试；APK 构建本身即编译验证）。
#   · 加一层 SDK 平台兜底安装（runner 没预装 android-35 时再装，失败不阻断）。
# 2026-11-14 修红：
#   · 上一版 ./gradlew 报 "Permission denied"（exit 126）：Windows 生成的 gradlew
#     在 git 里是 100644，Linux 检出后没有 x 位。已把索引改成 100755，
#     构建步骤里再加一道 chmod 兜底，避免任何机器检出后权限再丢。
on:
  push:
    branches: [main]
    paths:
      - "tianwang_app/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.3 + Kotlin 2.0.21 + Compose 编译器：JDK 17 足够。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 用项目自带 wrapper（gradle-wrapper.jar 已入库）；不指定 gradle-version，
      # setup-gradle 会自动跑 ./gradlew，和本地构建完全同版本。
      - uses: gradle/actions/setup-gradle@v4

      # 沿用上一版跑绿时的自检：镜像换了（ubuntu-26.04）也能一眼看清 SDK 在哪、装了哪些平台。
      - name: 打印 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      # runner 若没预装 compileSdk 35，这里补装；装不上（无 sdkmanager / 已装）也不阻断。
      - name: 兜底安装 Android SDK 平台
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && command -v "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" >/dev/null 2>&1; then
            yes 2>/dev/null | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "未检测到 sdkmanager，跳过（依赖 runner 预装 SDK）"
          fi

      # 直接出 debug APK：固定签名（keystore-debug.jks 已入库），可长期覆盖安装。
      - name: 构建 debug APK
        working-directory: tianwang_app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tianwang-next-debug
          path: tianwang_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions 的 artifact 在手机浏览器里基本下不动；挂到固定 tag 的 Release，
      # 手机打开 https://github.com/ghshhf/skynet-fleet/releases/tag/apk-latest 就能直装。
      - name: 发布到「最新 APK」Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=tianwang_app/app/build/outputs/apk/debug/app-debug.apk
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" --clobber
          else
            gh release create apk-latest "$APK" \
              --title "天网 APK（最新）" \
              --notes "由 build-app 自动更新；提交 ${GITHUB_SHA}。手机可直接下载安装。" \
              --prerelease
          fi
